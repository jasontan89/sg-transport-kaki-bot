<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SG Transport Kaki</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --brand-primary: #2563eb;
      --brand-primary-dark: #1d4ed8;
      --brand-accent: #38bdf8;
      --brand-header-bg: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #1e3a8a 100%);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-light: #e2e8f0;
      --accent-green: #16a34a;
      --accent-amber: #d97706;
      --accent-purple: #7c3aed;
      --pill-radius: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --card-bg: #131b2e;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --border-light: rgba(255, 255, 255, 0.08);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 24px;
    }

    /* SG Transport Kaki App Bar (Modern Transit Navy/Blue Theme) */
    .app-header {
      background: var(--brand-header-bg);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 14px rgba(11, 19, 43, 0.35);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px 16px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--brand-accent);
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-clock-pill {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      letter-spacing: 0.2px;
    }

    .header-icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: background 0.15s ease;
    }

    .header-icon-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Tabs Bar */
    .tabs-bar {
      display: flex;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(11, 19, 43, 0.4);
      backdrop-filter: blur(8px);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.65);
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: #ffffff;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      background: var(--brand-accent);
      border-radius: 3px 3px 0 0;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    }

    /* Active Alighting Alarm Banner (Midnight Indigo / Cyan Glow) */
    .alarm-banner {
      display: none;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border-bottom: 1px solid #4338ca;
      color: #fff;
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      animation: bannerGlow 2.5s infinite;
    }

    .alarm-banner.active {
      display: flex;
    }

    @keyframes bannerGlow {
      0% { box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1); }
      50% { box-shadow: inset 0 0 18px rgba(56, 189, 248, 0.3); }
      100% { box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1); }
    }

    /* Split-Screen Nearby Layout */
    .nearby-container {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Leaflet Map in Top Half */
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 250px;
      background: #e2e8f0;
      border-bottom: 2px solid var(--border-light);
      z-index: 10;
    }

    #nearby-map {
      width: 100%;
      height: 100%;
    }

    /* Custom Leaflet Pins (Transit Blue / Slate Callout) */
    .user-avatar-marker {
      font-size: 26px;
      text-align: center;
      line-height: 1;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.45));
    }

    .bus-stop-pin {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .pin-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #2563eb;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.45);
    }

    .pin-label {
      background: #0f172a;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
      margin-bottom: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Floating Royal Blue GPS FAB */
    .gps-fab {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      cursor: pointer;
      z-index: 500;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .gps-fab:hover {
      background: #1d4ed8;
    }

    .gps-fab:active {
      transform: scale(0.92);
    }

    /* Bus Stop List Section */
    .stop-list-scroll {
      flex: 1;
      background: var(--card-bg);
    }

    .stop-item-row {
      border-bottom: 1px solid var(--border-light);
      background: var(--card-bg);
      transition: background 0.15s ease;
    }

    .stop-item-row.expanded {
      background: rgba(37, 99, 235, 0.03);
    }

    .stop-main-header {
      display: flex;
      align-items: center;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
    }

    .stop-main-header:active {
      background: rgba(0, 0, 0, 0.04);
    }

    .chevron-icon {
      font-size: 15px;
      color: var(--text-sub);
      margin-right: 14px;
      transition: transform 0.2s ease, color 0.2s ease;
      width: 16px;
      text-align: center;
    }

    .stop-item-row.expanded .chevron-icon {
      transform: rotate(180deg);
      color: var(--brand-primary);
    }

    .stop-details-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stop-primary-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stop-secondary-road {
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stop-trailing-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stop-distance-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-primary);
      background: rgba(37, 99, 235, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .kebab-menu-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 19px;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      border-radius: 6px;
    }

    .kebab-menu-btn:active {
      background: rgba(0, 0, 0, 0.06);
    }

    /* Expandable Bus Arrival Drawer */
    .bus-arrivals-drawer {
      display: none;
      padding: 0 16px 14px 44px;
      flex-direction: column;
      gap: 8px;
      border-top: 1px dashed var(--border-light);
    }

    .stop-item-row.expanded .bus-arrivals-drawer {
      display: flex;
    }

    /* Stop Quick Actions Bar */
    .stop-quick-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .action-pill-btn {
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .action-pill-btn.active {
      background: rgba(217, 119, 6, 0.12);
      border-color: #d97706;
      color: #b45309;
    }

    .action-pill-btn:active {
      transform: scale(0.96);
    }

    /* Bus Arrival Cards */
    .service-card {
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .service-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .service-no-badge {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      min-width: 50px;
      letter-spacing: -0.3px;
    }

    .pills-cluster {
      display: flex;
      gap: 6px;
    }

    .timing-pill {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      border-radius: var(--pill-radius);
      font-size: 12px;
      font-weight: 700;
      min-width: 48px;
      justify-content: center;
    }

    .load-sea {
      background: rgba(22, 163, 74, 0.12);
      border: 1px solid rgba(22, 163, 74, 0.35);
      color: var(--accent-green);
    }

    .load-sda {
      background: rgba(217, 119, 6, 0.12);
      border: 1px solid rgba(217, 119, 6, 0.35);
      color: var(--accent-amber);
    }

    .load-lsd {
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.35);
      color: var(--accent-purple);
    }

    .load-none {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: var(--text-sub);
    }

    .service-card-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
    }

    /* Bus Service Filter Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0,0,0,0.35);
      border: 1px solid var(--border-light);
    }

    .modal-header {
      background: var(--brand-header-bg);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg);
      cursor: pointer;
      border: 1px solid var(--border-light);
      font-size: 14px;
      font-weight: 600;
    }

    .modal-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary {
      background: none;
      border: 1px solid var(--border-light);
      color: var(--text-sub);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand-primary);
      border: none;
      color: #fff;
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    /* MRT Map Tab */
    .mrt-map-container {
      width: 100%;
      height: calc(100vh - 105px);
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .mrt-map-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Toast Notification (Non-blocking replacement for alert) */
    .toast-container {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 90%;
      text-align: center;
    }

    .toast-container.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* Skeleton Loading */
    .skeleton-bar {
      height: 16px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      margin-bottom: 8px;
      animation: pulseSkel 1.5s infinite;
    }

    @keyframes pulseSkel {
      0% { opacity: 0.4; }
      50% { opacity: 0.85; }
      100% { opacity: 0.4; }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- SG Transport Kaki Header (Navy/Blue Modern Transit Theme) -->
  <header class="app-header">
    <div class="header-top">
      <div class="header-title">
        <span style="font-size: 20px;">🇸🇬</span>
        <span>SG Transport Kaki</span>
        <span class="header-badge">Live</span>
      </div>
      <div class="header-icons">
        <span class="header-clock-pill" id="header-clock">--:-- SGT</span>
        <button class="header-icon-btn" onclick="manualRefresh()" title="Refresh">&#128260;</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="tabs-bar">
      <button class="tab-btn" id="tab-fav" onclick="switchView('fav')">FAVOURITES</button>
      <button class="tab-btn active" id="tab-nearby" onclick="switchView('nearby')">NEARBY</button>
      <button class="tab-btn" id="tab-search" onclick="switchView('search')">SEARCH</button>
      <button class="tab-btn" id="tab-mrt" onclick="switchView('mrt')">MRT MAP</button>
    </nav>
  </header>

  <!-- Active Alighting Alarm Banner -->
  <div class="alarm-banner" id="alarm-banner">
    <div>
      <div style="font-weight: 700; font-size: 13px;">&#128276; Alighting Alarm Armed</div>
      <div id="alarm-banner-sub" style="font-size: 11px; opacity: 0.9;">Tracking distance to destination...</div>
    </div>
    <button onclick="cancelActiveAlarm()" style="background: rgba(255,255,255,0.25); border: none; color: #fff; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;">Cancel</button>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-el">
    <span id="toast-msg">Notice</span>
  </div>

  <!-- MAIN VIEWS CONTAINER -->
  <main style="flex: 1; display: flex; flex-direction: column;">
    
    <!-- 1. NEARBY VIEW (SPLIT-SCREEN MAP + LIST) -->
    <section id="view-nearby" class="nearby-container">
      <div class="map-wrapper">
        <div id="nearby-map"></div>
        <button class="gps-fab" onclick="recenterUserGPS()" title="Locate Me">&#127919;</button>
      </div>
      <div class="stop-list-scroll" id="nearby-stops-list">
        <div style="padding: 24px;">
          <div class="skeleton-bar" style="width: 45%;"></div>
          <div class="skeleton-bar" style="width: 75%;"></div>
          <div class="skeleton-bar" style="width: 60%; margin-top: 16px;"></div>
          <div class="skeleton-bar" style="width: 85%;"></div>
        </div>
      </div>
    </section>

    <!-- 2. FAVOURITES VIEW -->
    <section id="view-fav" style="display: none; background: var(--card-bg); flex: 1;">
      <div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light);">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase;">Saved Bus Stops</span>
        <button onclick="fetchFavoritesCloud()" style="background: none; border: none; color: var(--brand-primary); font-size: 12px; font-weight: 700; cursor: pointer;">&#128260; Sync</button>
      </div>
      <div class="stop-list-scroll" id="fav-stops-list">
        <div class="empty-state">
          <h3>No Favorites Saved</h3>
          <p style="font-size: 12px; margin-top: 4px;">Tap &#11088; on any bus stop to save it here for instant 1-tap arrival checks!</p>
        </div>
      </div>
    </section>

    <!-- 3. SEARCH VIEW -->
    <section id="view-search" style="display: none; padding: 14px; flex: 1;">
      <div style="display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 8px 12px; gap: 8px;">
        <span>&#128269;</span>
        <input type="text" id="search-input" placeholder="Search stop code or road (e.g. 43539, Orchard)" style="flex: 1; border: none; outline: none; background: none; font-size: 14px; color: var(--text-main);" oninput="onSearchInput(this.value)">
      </div>
      <div id="search-results-list" style="margin-top: 12px;"></div>
    </section>

    <!-- 4. MRT MAP VIEW -->
    <section id="view-mrt" style="display: none;">
      <div class="mrt-map-container">
        <img src="https://www.lta.gov.sg/content/dam/ltagov/getting_around/public_transport/rail_network/image/system-map-with-cr-pce-ccl-icon.jpg" alt="Singapore MRT Network Map" class="mrt-map-img" />
      </div>
    </section>

  </main>

  <!-- Bus Service Filter Modal -->
  <div class="modal-overlay" id="filter-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="filter-modal-title">Filter Buses for Stop</h3>
        <button onclick="closeFilterModal()" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;">&#10005;</button>
      </div>
      <div class="modal-body" id="filter-modal-body">
        <!-- List of checkboxes for each service -->
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="selectAllFilter(true)">Show All</button>
        <button class="btn-primary" onclick="saveFilterModal()">Save Filter</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://blcsjvifiytbznwesmyx.supabase.co/functions/v1/lta_bot";

    let tgUser = null;
    if (window.Telegram && window.Telegram.WebApp) {
      try {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.setHeaderColor('#0b132b');
        window.Telegram.WebApp.setBackgroundColor('#f8fafc');
        tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
      } catch (e) {
        console.warn("Telegram WebApp init:", e);
      }
    }

    function haptic(type = 'light') {
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          if (type === 'selection') window.Telegram.WebApp.HapticFeedback.selectionChanged();
          else if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          else if (type === 'warning') window.Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
          else window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    let toastTimer = null;
    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toast-el');
      const text = document.getElementById('toast-msg');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // State
    let userLat = 1.3521;
    let userLon = 103.8198;
    let currentView = 'nearby';
    let map = null;
    let userMarker = null;
    let stopMarkers = [];
    let nearbyStopsData = [];
    let favoritesList = [];
    let serviceFilters = {}; // stopCode -> Set of selected services
    let activeAlarm = null;
    let watchGpsId = null;

    // Load Local Cache safely
    try {
      favoritesList = JSON.parse(localStorage.getItem('sg_bus_fav_stops') || '[]');
      serviceFilters = JSON.parse(localStorage.getItem('sg_bus_filters') || '{}');
    } catch (e) {
      favoritesList = [];
      serviceFilters = {};
    }

    // Clock
    function updateClock() {
      try {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-SG', { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit' });
        const clockEl = document.getElementById('header-clock');
        if (clockEl) clockEl.innerText = timeStr + ' SGT';
      } catch (e) {}
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Leaflet Map Init
    function initMap() {
      if (map) return;
      const mapEl = document.getElementById('nearby-map');
      if (!mapEl) return;

      map = L.map('nearby-map', { zoomControl: false }).setView([userLat, userLon], 16);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Commuter Person Avatar Marker
      const userIcon = L.divIcon({
        html: '<div class="user-avatar-marker">&#128694;</div>',
        className: 'user-pin-wrap',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      userMarker = L.marker([userLat, userLon], { icon: userIcon }).addTo(map);
    }

    // View Switcher
    function switchView(viewName) {
      haptic('selection');
      currentView = viewName;
      ['fav', 'nearby', 'search', 'mrt'].forEach(v => {
        const el = document.getElementById('view-' + v);
        if (el) el.style.display = (v === viewName) ? (v === 'nearby' ? 'flex' : 'block') : 'none';
        const tabBtn = document.getElementById('tab-' + v);
        if (tabBtn) {
          if (v === viewName) tabBtn.classList.add('active');
          else tabBtn.classList.remove('active');
        }
      });

      if (viewName === 'nearby') {
        setTimeout(() => { if (map) map.invalidateSize(); }, 150);
      } else if (viewName === 'fav') {
        renderFavoritesView();
      }
    }

    // GPS & Nearby Stops
    function initGPS() {
      initMap();
      let gpsResolved = false;

      // Timeout fallback: if GPS takes > 2.5s, load default Singapore location so user never hangs
      const fallbackTimer = setTimeout(() => {
        if (!gpsResolved && nearbyStopsData.length === 0) {
          console.log("GPS timeout, fetching default location stops...");
          fetchNearbyStops();
        }
      }, 2500);

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            gpsResolved = true;
            clearTimeout(fallbackTimer);
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            updateUserPosition(userLat, userLon);
            fetchNearbyStops();
          },
          err => {
            console.warn('GPS error, using default Singapore location:', err);
            gpsResolved = true;
            clearTimeout(fallbackTimer);
            updateUserPosition(userLat, userLon);
            fetchNearbyStops();
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        fetchNearbyStops();
      }
    }

    function updateUserPosition(lat, lon) {
      if (userMarker) userMarker.setLatLng([lat, lon]);
      if (map) map.setView([lat, lon], 16);
    }

    function recenterUserGPS() {
      haptic('medium');
      if (map) map.setView([userLat, userLon], 16);
      showToast('📍 Recycled view to current location');
    }

    async function fetchNearbyStops() {
      try {
        const res = await fetch(API_BASE + '/api/bus-nearby?lat=' + userLat + '&lon=' + userLon + '&limit=15');
        const data = await res.json();
        if (data.ok && data.stops) {
          nearbyStopsData = data.stops;
          renderNearbyMapPins(data.stops);
          renderNearbyList(data.stops);
        } else {
          showToast('Unable to load nearby stops');
        }
      } catch (e) {
        console.error('Fetch nearby stops error:', e);
        const container = document.getElementById('nearby-stops-list');
        if (container) {
          container.innerHTML = '<div class="empty-state"><h3>Offline or Network Error</h3><p>Could not fetch nearby bus stops. Please tap refresh.</p></div>';
        }
      }
    }

    // Render Map Pins with Labels (Transit Navy / Blue Theme)
    function renderNearbyMapPins(stops) {
      initMap();
      stopMarkers.forEach(m => map.removeLayer(m));
      stopMarkers = [];

      stops.forEach(s => {
        if (!s.latitude || !s.longitude) return;

        const pinHtml = 
          '<div class="bus-stop-pin" onclick="onMapPinClick(\'' + s.bus_stop_code + '\')">' +
            '<div class="pin-label">' + s.description + '</div>' +
            '<div class="pin-dot"></div>' +
          '</div>';

        const customIcon = L.divIcon({
          html: pinHtml,
          className: 'bus-pin-wrap',
          iconSize: [130, 38],
          iconAnchor: [65, 32]
        });

        const marker = L.marker([s.latitude, s.longitude], { icon: customIcon }).addTo(map);
        stopMarkers.push(marker);
      });
    }

    function onMapPinClick(stopCode) {
      haptic('selection');
      expandStopInList(stopCode, true);
    }

    // Render Nearby List with clean distance & actions
    function renderNearbyList(stops) {
      const container = document.getElementById('nearby-stops-list');
      if (!container) return;
      container.innerHTML = '';

      if (stops.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No Bus Stops Nearby</h3><p>Try moving closer to a bus stop or search above.</p></div>';
        return;
      }

      stops.forEach(s => {
        const isFav = isStopFavorited(s.bus_stop_code);
        
        // Accurate distance calculation (no NaN)
        const d = s.distance !== undefined ? s.distance : (s.dist_meters !== undefined ? s.dist_meters : 0);
        const distText = d < 1000 ? Math.round(d) + 'm away' : (d / 1000).toFixed(1) + 'km away';

        const row = document.createElement('div');
        row.className = 'stop-item-row';
        row.id = 'stop-row-' + s.bus_stop_code;

        const cleanDesc = (s.description || 'Bus Stop ' + s.bus_stop_code).replace(/'/g, "");
        const latVal = s.latitude || 0;
        const lonVal = s.longitude || 0;

        row.innerHTML = 
          '<div class="stop-main-header" onclick="toggleStopExpansion(\'' + s.bus_stop_code + '\')">' +
            '<span class="chevron-icon">&#9660;</span>' +
            '<div class="stop-details-col">' +
              '<div class="stop-primary-name">' + s.description + '</div>' +
              '<div class="stop-secondary-road">' + s.road_name + ' (' + s.bus_stop_code + ')</div>' +
            '</div>' +
            '<div class="stop-trailing-group">' +
              '<span class="stop-distance-badge">' + distText + '</span>' +
              '<button class="kebab-menu-btn" onclick="openStopFilter(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + '\')" title="Options">&#8942;</button>' +
            '</div>' +
          '</div>' +
          '<div class="bus-arrivals-drawer" id="arrivals-drawer-' + s.bus_stop_code + '">' +
            '<div class="stop-quick-actions">' +
              '<button class="action-pill-btn ' + (isFav ? 'active' : '') + '" id="fav-btn-' + s.bus_stop_code + '" onclick="toggleFavoriteStop(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + ' (' + s.bus_stop_code + ')\')">' +
                (isFav ? '&#11088; Saved' : '&#9734; Save Stop') +
              '</button>' +
              '<button class="action-pill-btn" onclick="openStopFilter(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + '\')">&#9881;&#65039; Filter Buses</button>' +
              '<button class="action-pill-btn" onclick="armAlightAlarm(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + '\', ' + latVal + ', ' + lonVal + ')">&#128276; Alight Alarm</button>' +
            '</div>' +
            '<div class="bus-services-list" id="services-list-' + s.bus_stop_code + '">' +
              '<div style="font-size: 11px; color: var(--text-sub); padding: 8px 0;">Loading live arrivals...</div>' +
            '</div>' +
          '</div>';

        container.appendChild(row);
      });
    }

    function toggleStopExpansion(stopCode) {
      haptic('selection');
      expandStopInList(stopCode, false);
    }

    function expandStopInList(stopCode, scrollIntoView = false) {
      const row = document.getElementById('stop-row-' + stopCode);
      if (!row) return;

      const isExpanded = row.classList.contains('expanded');
      if (isExpanded && !scrollIntoView) {
        row.classList.remove('expanded');
      } else {
        row.classList.add('expanded');
        loadArrivalsForStop(stopCode);
        if (scrollIntoView) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    // Load arrivals and apply custom bus service filter
    async function loadArrivalsForStop(stopCode) {
      const listEl = document.getElementById('services-list-' + stopCode) || document.getElementById('fav-services-' + stopCode);
      if (!listEl) return;

      try {
        const res = await fetch(API_BASE + '/api/bus-arrivals?stop=' + stopCode);
        const data = await res.json();
        if (!data.ok || !data.services || data.services.length === 0) {
          listEl.innerHTML = '<div style="font-size: 12px; color: var(--text-sub); padding: 8px 0;">No active buses operating right now.</div>';
          return;
        }

        renderServicesWithFilter(listEl, stopCode, data.services);
      } catch (e) {
        listEl.innerHTML = '<div style="font-size: 12px; color: var(--text-sub); padding: 8px 0;">Failed to fetch live timings.</div>';
      }
    }

    function renderServicesWithFilter(container, stopCode, allServices) {
      container.innerHTML = '';
      const filterSet = serviceFilters[stopCode];

      const displayList = (filterSet && filterSet.length > 0)
        ? allServices.filter(s => filterSet.includes(String(s.ServiceNo)))
        : allServices;

      if (displayList.length === 0 && allServices.length > 0) {
        container.innerHTML = 
          '<div style="font-size: 12px; color: var(--text-sub); padding: 8px 0;">' +
            'All services hidden by filter. <a href="javascript:void(0)" onclick="openStopFilter(null, \'' + stopCode + '\', \'Bus Stop\')" style="color: var(--brand-primary); font-weight: 700;">Edit Filter</a>' +
          '</div>';
        return;
      }

      displayList.forEach(s => {
        const p1 = s.NextBus;
        const p2 = s.NextBus2;
        const p3 = s.NextBus3;

        const card = document.createElement('div');
        card.className = 'service-card';

        const mins1 = formatMins(p1?.EstimatedArrival);
        const mins2 = formatMins(p2?.EstimatedArrival);
        const mins3 = formatMins(p3?.EstimatedArrival);

        const loadClass1 = getLoadClass(p1?.Load);
        const loadClass2 = getLoadClass(p2?.Load);
        const loadClass3 = getLoadClass(p3?.Load);

        const isWAB = p1?.Feature === 'WAB';
        const isDD = p1?.Type === 'DD';

        card.innerHTML = 
          '<div class="service-card-top">' +
            '<div style="display: flex; align-items: center; gap: 8px;">' +
              '<span class="service-no-badge">' + s.ServiceNo + '</span>' +
              (isDD ? '<span style="font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px;">DD</span>' : '') +
              (isWAB ? '<span style="font-size: 11px;">&#9855;</span>' : '') +
            '</div>' +
            '<div class="pills-cluster">' +
              '<div class="timing-pill ' + loadClass1 + '">' + mins1 + '</div>' +
              '<div class="timing-pill ' + loadClass2 + '">' + mins2 + '</div>' +
              '<div class="timing-pill ' + loadClass3 + '">' + mins3 + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="service-card-bottom">' +
            '<span>Next: ' + (p1?.EstimatedArrival ? formatTimeOnly(p1.EstimatedArrival) : 'N/A') + '</span>' +
            '<span>' + (p1?.Load === 'SEA' ? 'Seats Avail' : p1?.Load === 'SDA' ? 'Standing Avail' : p1?.Load === 'LSD' ? 'Crowded' : '') + '</span>' +
          '</div>';

        container.appendChild(card);
      });
    }

    function formatMins(isoStr) {
      if (!isoStr) return '-';
      const diffMs = new Date(isoStr).getTime() - Date.now();
      const mins = Math.round(diffMs / 60000);
      if (mins <= 0) return 'Arr';
      if (mins === 1) return '1m';
      return mins + 'm';
    }

    function formatTimeOnly(isoStr) {
      try {
        return new Date(isoStr).toLocaleTimeString('en-SG', { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    function getLoadClass(load) {
      if (load === 'SEA') return 'load-sea';
      if (load === 'SDA') return 'load-sda';
      if (load === 'LSD') return 'load-lsd';
      return 'load-none';
    }

    // Filter Modal Logic
    let activeFilterStopCode = null;
    let activeFilterStopName = null;
    let modalAvailableServices = [];

    async function openStopFilter(event, stopCode, stopName) {
      if (event) event.stopPropagation();
      haptic('selection');

      activeFilterStopCode = stopCode;
      activeFilterStopName = stopName;
      document.getElementById('filter-modal-title').innerText = 'Filter: ' + stopName;

      const modalBody = document.getElementById('filter-modal-body');
      modalBody.innerHTML = '<div style="padding: 10px; color: var(--text-sub);">Loading bus services...</div>';
      document.getElementById('filter-modal').classList.add('open');

      try {
        const res = await fetch(API_BASE + '/api/bus-arrivals?stop=' + stopCode);
        const data = await res.json();
        const services = (data.services || []).map(s => String(s.ServiceNo));
        modalAvailableServices = [...new Set(services)];

        if (modalAvailableServices.length === 0) {
          modalBody.innerHTML = '<div style="padding: 10px; color: var(--text-sub);">No active services found for this stop.</div>';
          return;
        }

        const currentSavedFilter = serviceFilters[stopCode]; // Array
        modalBody.innerHTML = '';

        modalAvailableServices.forEach(srv => {
          const isChecked = !currentSavedFilter || currentSavedFilter.includes(srv);
          const item = document.createElement('label');
          item.className = 'filter-item';
          item.innerHTML = 
            '<span>Bus <b>' + srv + '</b></span>' +
            '<input type="checkbox" value="' + srv + '" ' + (isChecked ? 'checked' : '') + ' style="width: 18px; height: 18px; accent-color: var(--brand-primary);">';
          modalBody.appendChild(item);
        });
      } catch (e) {
        modalBody.innerHTML = '<div style="color: var(--text-sub);">Failed to load services for filtering.</div>';
      }
    }

    function closeFilterModal() {
      document.getElementById('filter-modal').classList.remove('open');
    }

    function selectAllFilter(enableAll) {
      document.querySelectorAll('#filter-modal-body input[type="checkbox"]').forEach(cb => {
        cb.checked = enableAll;
      });
    }

    async function saveFilterModal() {
      haptic('success');
      if (!activeFilterStopCode) return;

      const checked = [];
      document.querySelectorAll('#filter-modal-body input[type="checkbox"]').forEach(cb => {
        if (cb.checked) checked.push(cb.value);
      });

      if (checked.length === modalAvailableServices.length) {
        delete serviceFilters[activeFilterStopCode];
      } else {
        serviceFilters[activeFilterStopCode] = checked;
      }

      localStorage.setItem('sg_bus_filters', JSON.stringify(serviceFilters));
      closeFilterModal();

      // Cloud sync filter if stop is favorited
      if (tgUser?.id && isStopFavorited(activeFilterStopCode)) {
        fetch(API_BASE + '/api/bus-favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: tgUser.id,
            action: 'update',
            type: 'bus',
            value: activeFilterStopCode,
            label: activeFilterStopName,
            metadata: { visible_services: serviceFilters[activeFilterStopCode] || [] }
          })
        }).catch(e => console.warn('Filter sync error:', e));
      }

      // Re-render
      loadArrivalsForStop(activeFilterStopCode);
      showToast('Filters updated successfully');
    }

    // Favorites Management (Synced with Supabase)
    function isStopFavorited(stopCode) {
      return favoritesList.some(f => f.value === stopCode);
    }

    async function toggleFavoriteStop(event, stopCode, stopLabel) {
      if (event) event.stopPropagation();
      haptic('medium');

      const idx = favoritesList.findIndex(f => f.value === stopCode);
      const isAdding = (idx === -1);

      if (isAdding) {
        favoritesList.push({ type: 'bus', value: stopCode, label: stopLabel });
        showToast('⭐ Saved to Favorites');
      } else {
        favoritesList.splice(idx, 1);
        showToast('Removed from Favorites');
      }

      localStorage.setItem('sg_bus_fav_stops', JSON.stringify(favoritesList));

      // Update UI buttons
      const favBtn = document.getElementById('fav-btn-' + stopCode);
      if (favBtn) {
        favBtn.className = 'action-pill-btn ' + (isAdding ? 'active' : '');
        favBtn.innerHTML = isAdding ? '&#11088; Saved' : '&#9734; Save Stop';
      }

      if (currentView === 'fav') {
        renderFavoritesView();
      }

      // Cloud sync
      if (tgUser?.id) {
        try {
          await fetch(API_BASE + '/api/bus-favorites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userId: tgUser.id,
              action: isAdding ? 'add' : 'remove',
              type: 'bus',
              value: stopCode,
              label: stopLabel,
              metadata: { visible_services: serviceFilters[stopCode] || [] }
            })
          });
        } catch (e) {
          console.warn('Fav cloud sync error:', e);
        }
      }
    }

    async function fetchFavoritesCloud() {
      if (!tgUser?.id) return;
      try {
        const res = await fetch(API_BASE + '/api/bus-favorites?userId=' + tgUser.id);
        const data = await res.json();
        if (data.ok && data.favorites) {
          favoritesList = data.favorites.map(f => ({
            type: f.type,
            value: f.value,
            label: f.label
          }));
          localStorage.setItem('sg_bus_fav_stops', JSON.stringify(favoritesList));

          // Sync filters from metadata
          data.favorites.forEach(f => {
            if (f.metadata?.visible_services) {
              serviceFilters[f.value] = f.metadata.visible_services;
            }
          });
          localStorage.setItem('sg_bus_filters', JSON.stringify(serviceFilters));

          renderFavoritesView();
        }
      } catch (e) {
        console.error('Fetch cloud favs error:', e);
      }
    }

    function renderFavoritesView() {
      const container = document.getElementById('fav-stops-list');
      if (!container) return;

      if (favoritesList.length === 0) {
        container.innerHTML = 
          '<div class="empty-state">' +
            '<h3>No Favorites Saved</h3>' +
            '<p style="font-size: 12px; margin-top: 4px;">Tap &#11088; on any bus stop to save it here for instant 1-tap checks!</p>' +
          '</div>';
        return;
      }

      container.innerHTML = '';
      favoritesList.forEach(f => {
        const card = document.createElement('div');
        card.className = 'stop-item-row expanded';
        const cleanDesc = (f.label || f.value).replace(/'/g, "");

        card.innerHTML = 
          '<div class="stop-main-header">' +
            '<div class="stop-details-col">' +
              '<div class="stop-primary-name">' + (f.label || f.value) + '</div>' +
              '<div class="stop-secondary-road">Bus Stop Code: ' + f.value + '</div>' +
            '</div>' +
            '<div class="stop-trailing-group">' +
              '<button class="action-pill-btn active" onclick="toggleFavoriteStop(event, \'' + f.value + '\', \'' + cleanDesc + '\')">&#11088; Unpin</button>' +
              '<button class="action-pill-btn" onclick="openStopFilter(event, \'' + f.value + '\', \'' + cleanDesc + '\')">&#9881;&#65039;</button>' +
            '</div>' +
          '</div>' +
          '<div class="bus-arrivals-drawer" style="display: flex;">' +
            '<div class="bus-services-list" id="fav-services-' + f.value + '">' +
              '<div style="font-size: 11px; color: var(--text-sub); padding: 6px 0;">Loading live timings...</div>' +
            '</div>' +
          '</div>';

        container.appendChild(card);
        loadArrivalsForStop(f.value);
      });
    }

    // Alighting Alarm with Telegram Chat Delivery
    function armAlightAlarm(event, stopCode, stopName, lat, lon) {
      if (event) event.stopPropagation();
      haptic('warning');

      activeAlarm = {
        stopCode,
        stopName,
        lat: parseFloat(lat),
        lon: parseFloat(lon),
        thresholdMeters: 500,
        triggered: false
      };

      document.getElementById('alarm-banner-sub').innerText = 'Target: ' + stopName + ' (' + stopCode + ') [Radius: 500m]';
      document.getElementById('alarm-banner').classList.add('active');

      if (watchGpsId) navigator.geolocation.clearWatch(watchGpsId);
      watchGpsId = navigator.geolocation.watchPosition(
        onAlarmGPSUpdate,
        err => console.warn('Alarm GPS error:', err),
        { enableHighAccuracy: true, maximumAge: 3000 }
      );

      // Send confirmation to Telegram chat via API
      if (tgUser?.id) {
        fetch(API_BASE + '/api/bus-alight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: tgUser.id,
            chatId: tgUser.id,
            destStopCode: stopCode,
            destName: stopName,
            destLat: lat,
            destLon: lon,
            thresholdMeters: 500
          })
        }).catch(e => console.warn('Alarm sync error:', e));
      }

      showToast('🔔 Alarm armed for ' + stopName + '! Confirmation sent to Telegram chat.', 4000);
    }

    function onAlarmGPSUpdate(pos) {
      if (!activeAlarm || activeAlarm.triggered) return;
      const dist = computeDistMeters(pos.coords.latitude, pos.coords.longitude, activeAlarm.lat, activeAlarm.lon);
      const subEl = document.getElementById('alarm-banner-sub');
      if (subEl) subEl.innerText = Math.round(dist) + 'm away from destination';

      if (dist <= activeAlarm.thresholdMeters) {
        activeAlarm.triggered = true;
        triggerArrivalAlert(dist);
      }
    }

    function triggerArrivalAlert(dist) {
      haptic('warning');
      haptic('success');

      // Send Telegram wake-up message to chat
      if (tgUser?.id) {
        fetch(API_BASE + '/api/bus-alight-trigger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: tgUser.id,
            chatId: tgUser.id,
            destStopCode: activeAlarm.stopCode,
            destName: activeAlarm.stopName,
            distance: dist
          })
        }).catch(e => console.warn('Trigger sync error:', e));
      }

      showToast('🚨 WAKE UP! Arriving at ' + activeAlarm.stopName + ' (within 500m)!', 8000);
      cancelActiveAlarm();
    }

    function cancelActiveAlarm() {
      activeAlarm = null;
      if (watchGpsId) {
        navigator.geolocation.clearWatch(watchGpsId);
        watchGpsId = null;
      }
      const banner = document.getElementById('alarm-banner');
      if (banner) banner.classList.remove('active');
      showToast('Alighting alarm cancelled');
    }

    function computeDistMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const dPhi = (lat2 - lat1) * Math.PI / 180;
      const dLam = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dPhi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dLam/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Search View Logic
    let searchTimer = null;
    function onSearchInput(val) {
      clearTimeout(searchTimer);
      const q = val.trim();
      if (!q) {
        document.getElementById('search-results-list').innerHTML = '';
        return;
      }
      searchTimer = setTimeout(async () => {
        const area = document.getElementById('search-results-list');
        area.innerHTML = '<div style="padding: 10px; color: var(--text-sub);">Searching...</div>';
        try {
          const res = await fetch(API_BASE + '/api/bus-search?q=' + encodeURIComponent(q));
          const data = await res.json();
          renderSearchResults(data.stops || []);
        } catch (e) {
          area.innerHTML = '<div style="color: var(--text-sub);">Search failed.</div>';
        }
      }, 300);
    }

    function renderSearchResults(stops) {
      const container = document.getElementById('search-results-list');
      if (stops.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No bus stops found.</p></div>';
        return;
      }
      container.innerHTML = '';
      stops.forEach(s => {
        const row = document.createElement('div');
        row.className = 'stop-item-row';
        row.id = 'stop-row-' + s.bus_stop_code;
        const cleanDesc = (s.description || 'Bus Stop').replace(/'/g, "");
        const latVal = s.latitude || 0;
        const lonVal = s.longitude || 0;

        row.innerHTML = 
          '<div class="stop-main-header" onclick="toggleStopExpansion(\'' + s.bus_stop_code + '\')">' +
            '<span class="chevron-icon">&#9660;</span>' +
            '<div class="stop-details-col">' +
              '<div class="stop-primary-name">' + s.description + '</div>' +
              '<div class="stop-secondary-road">' + s.road_name + ' (' + s.bus_stop_code + ')</div>' +
            '</div>' +
          '</div>' +
          '<div class="bus-arrivals-drawer" id="arrivals-drawer-' + s.bus_stop_code + '">' +
            '<div class="stop-quick-actions">' +
              '<button class="action-pill-btn" onclick="toggleFavoriteStop(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + ' (' + s.bus_stop_code + ')\')">&#11088; Save Stop</button>' +
              '<button class="action-pill-btn" onclick="openStopFilter(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + '\')">&#9881;&#65039; Filter</button>' +
              '<button class="action-pill-btn" onclick="armAlightAlarm(event, \'' + s.bus_stop_code + '\', \'' + cleanDesc + '\', ' + latVal + ', ' + lonVal + ')">&#128276; Alarm</button>' +
            '</div>' +
            '<div class="bus-services-list" id="services-list-' + s.bus_stop_code + '">' +
              '<div style="font-size: 11px; color: var(--text-sub); padding: 8px 0;">Loading arrivals...</div>' +
            '</div>' +
          '</div>';

        container.appendChild(row);
      });
    }

    function manualRefresh() {
      haptic('medium');
      showToast('Refreshing live data...');
      if (currentView === 'nearby') fetchNearbyStops();
      else if (currentView === 'fav') fetchFavoritesCloud();
    }

    // Auto Refresh cycle (30s)
    setInterval(() => {
      if (currentView === 'nearby') {
        document.querySelectorAll('.stop-item-row.expanded').forEach(r => {
          const code = r.id.replace('stop-row-', '');
          loadArrivalsForStop(code);
        });
      } else if (currentView === 'fav') {
        favoritesList.forEach(f => loadArrivalsForStop(f.value));
      }
    }, 30000);

    // Deep Linking
    function handleDeepLink() {
      const p = new URLSearchParams(window.location.search);
      const stopParam = p.get('stop');
      if (stopParam) {
        switchView('search');
        document.getElementById('search-input').value = stopParam;
        onSearchInput(stopParam);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initGPS();
      handleDeepLink();
      if (tgUser?.id) fetchFavoritesCloud();
    });
  </script>
</body>
</html>
